<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Workout Tracker</title>
<style>
  :root { --purple:#6d4aff; --bg:#f6f5ff; --card:#fff; --ok:#2e9e5b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,sans-serif; margin:0; background:var(--bg); color:#222; }
  header { background:var(--purple); color:#fff; padding:16px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:20px; }
  .weeknav { display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:14px; }
  .weeknav button { background:rgba(255,255,255,.2); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:16px; }
  main { padding:12px; max-width:600px; margin:0 auto; }
  .day { background:var(--card); border-radius:14px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; }
  .day h2 { margin:0 0 4px; font-size:16px; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #eee; }
  .item:last-child { border-bottom:none; }
  .item label { flex:1; font-size:15px; line-height:1.3; }
  .item.done label { color:#999; text-decoration:line-through; }
  .check { width:28px; height:28px; border:2px solid var(--purple); border-radius:8px; flex-shrink:0;
           display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
  .done .check { background:var(--ok); border-color:var(--ok); }
  input[type=number], input[type=text] { width:70px; padding:8px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
  textarea { width:100%; min-height:60px; border:1px solid #ccc; border-radius:10px; padding:8px; font-size:14px; margin-top:6px; }
  .progress { height:8px; background:#e6e1ff; border-radius:4px; overflow:hidden; margin:10px 0 2px; }
  .progress div { height:100%; background:var(--ok); width:0; transition:width .3s; }
  .pct { font-size:13px; color:#666; margin-bottom:10px; }
  .summary { background:var(--card); border-radius:14px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .summary h2 { font-size:16px; margin:0 0 8px; }
  .save { font-size:12px; color:var(--ok); text-align:center; height:16px; margin-top:6px; }
  .warn { background:#fff4e5; border-radius:10px; padding:10px; font-size:13px; color:#8a5a00; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <h1>🏋️ Workout Tracker</h1>
  <div class="weeknav">
    <button onclick="shiftWeek(-1)">‹ Prev</button>
    <span id="weekLabel"></span>
    <button onclick="shiftWeek(1)">Next ›</button>
  </div>
</header>
<main id="app"></main>
<script>
const DAYS = [
 { name:"Session 1 — Cardio", items:[
   {id:"bp1",  t:"Blood pressure check before session", num:"sys/dia (text)"},
   {id:"wu1",  t:"Warm-up: 5 min easy bike/walk + mobility"},
   {id:"c1",   t:"Cardio: bike/walk/elliptical (conversational pace)", num:"mins"},
   {id:"cd1",  t:"Cool-down: 5 min easy + chest/calf stretch"}]},
 { name:"Session 2 — Light Strength", items:[
   {id:"bp2",  t:"Blood pressure check before session", num:"sys/dia (text)"},
   {id:"wu2",  t:"Warm-up: 5 min easy bike/walk + mobility"},
   {id:"lp",   t:"Leg press (light) or sit-to-stands — 2×12–15", num:"reps"},
   {id:"cp",   t:"Seated chest press (light) or wall push-ups", num:"reps"},
   {id:"row",  t:"Seated row", num:"reps"},
   {id:"step", t:"Leg curls or step-ups (low step)", num:"reps"},
   {id:"core", t:"Seated abdominal bracing (gentle, no strain)", num:"secs"},
   {id:"cd2",  t:"Finisher: 5 min easy bike cool-down"}]},
 { name:"Session 3 — Cardio + Balance", items:[
   {id:"bp3",  t:"Blood pressure check before session", num:"sys/dia (text)"},
   {id:"wu3",  t:"Warm-up: 5 min easy bike/walk + mobility"},
   {id:"c3",   t:"Cardio: 20–25 min easy pace", num:"mins"},
   {id:"htw",  t:"Heel-to-toe walking", num:"lengths"},
   {id:"bal",  t:"Single-leg stands (supported, each side)", num:"secs"},
   {id:"str",  t:"Stretch: chest, hamstrings, calves"}]}
];

let offset = 0;
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function weekStart(){ const m=mondayOf(new Date()); m.setDate(m.getDate()+offset*7); return m; }
function fmtDate(d){ return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function key(){ return 'wk_'+weekStart().toISOString().slice(0,10); }
function load(){ try{ return JSON.parse(localStorage.getItem(key()))||{} }catch(e){ return {} } }
function save(data){ localStorage.setItem(key(), JSON.stringify(data)); }

let data = load();
function update(id, field, value){
  data[id] = data[id]||{};
  data[id][field]=value;
  save(data); render(false);
}

function render(fresh=true){
  if(fresh) data = load();
  const ws = weekStart();
  document.getElementById('weekLabel').textContent =
    fmtDate(ws)+' – '+fmtDate(new Date(ws.getTime()+6*864e5));
  let total=0, done=0, html='';
  DAYS.forEach((d,di)=>{
    html += `<div class="day"><h2>${d.name}</h2>`;
    d.items.forEach(it=>{
      total++;
      const st=data[it.id]||{}, isDone=!!st.done;
      if(isDone) done++;
      const inputType = it.num==='sys/dia (text)' ? 'text' : 'number';
      const inputMode = inputType==='text' ? '' : 'inputmode="decimal"';
      html += `<div class="item ${isDone?'done':''}">
        <div class="check" onclick="update('${it.id}','done',${!isDone})">${isDone?'✓':''}</div>
        <label onclick="update('${it.id}','done',${!isDone})">${it.t}${it.num?' <small>('+it.num+')</small>':''}</label>
        ${it.num?`<input type="${inputType}" ${inputMode} value="${st.val??''}"
           placeholder="${it.num}" onchange="update('${it.id}','val',this.value)">`:''}
      </div>`;
    });
    const nt=data['note'+di]?.val||'';
    html += `<textarea placeholder="Notes…" onchange="update('note${di}','val',this.value)">${nt}</textarea></div>`;
  });
  html += `<div class="warn">⚠️ Skip intense work if BP is above your doctor's target. Stop and seek help for chest pain, dizziness, or unusual breathlessness.</div>
  <div class="summary"><h2>Weekly summary</h2>
    <div class="item"><label>Average BP this week</label><input type="text"
      value="${data.avgbp?.val??''}" onchange="update('avgbp','val',this.value)"></div>
    <div class="item"><label>Weight (lbs)</label><input type="number" inputmode="decimal"
      value="${data.weight?.val??''}" onchange="update('weight','val',this.value)"></div>
    <div class="item"><label>Energy (1–10)</label><input type="number" inputmode="numeric"
      value="${data.energy?.val??''}" onchange="update('energy','val',this.value)"></div>
    <textarea placeholder="Anything unusual to tell the doctor?" onchange="update('unusual','val',this.value)">${data.unusual?.val||''}</textarea>
  </div>
  <div class="save">Saved automatically ✓</div>`;
  document.getElementById('app').innerHTML =
    `<div class="progress"><div style="width:${total?100*done/total:0}%"></div></div>
     <div class="pct">${done} of ${total} items completed this week</div>` + html;
}
function shiftWeek(n){ offset+=n; render(); }
render();
</script>
</body>
</html>
